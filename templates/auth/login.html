{% extends 'base.html' %}

{% block container_class %}app-page{% endblock %}
{% block global_messages %}{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="app-card">
        <h2 class="app-page-title">Login</h2>

        {% for message in messages %}
            <div class="alert {% if 'success' in message.tags %}alert-success{% else %}auth-error{% endif %} py-2">{{ message }}</div>
        {% endfor %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            <input name="username" class="form-control mb-3 app-input" placeholder="Username">
            <input name="password" type="password" class="form-control mb-3 app-input" placeholder="Password">
            <button class="btn btn-natcord w-100">Login</button>
        </form>
        <a href="/register/" class="btn btn-natcord-dark w-100 mt-3">Register</a>
    </div>
</div>
{% endblock %}
